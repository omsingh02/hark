[package]
name = "hark-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Landmark audio fingerprinting and Shazam response models for hark"
license = "GPL-3.0-or-later"
repository = "https://github.com/omsingh02/hark"
publish = false

[dependencies]
realfft = "3.4"
rustfft = "6.4"
byteorder = "1.5"
crc32fast = "1.4"
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
