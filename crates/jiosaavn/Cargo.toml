[package]
name = "jiosaavn"
version = "0.1.0"
edition = "2021"
description = "Production-grade JioSaavn music search, streaming, and metadata-tagged downloader"
rust-version = "1.88"
license = "GPL-3.0-or-later"
repository = "https://github.com/omsingh02/hark"
publish = false

[lib]
name = "jiosaavn"
path = "src/lib.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
mp4ameta = "0.13"
dirs = "6.0"

[dev-dependencies]
clap = { version = "4.5", features = ["derive"] }
