[workspace]
members = [
    ".",
    "crates/hark-core",
    "crates/jiosaavn",
]

[package]
name = "hark"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Always-on song recognition for Linux, exposed as an MPRIS2 media player"
license = "GPL-3.0-or-later"
repository = "https://github.com/omsingh02/hark"
homepage = "https://github.com/omsingh02/hark"
readme = "README.md"
keywords = ["music", "audio", "mpris", "dbus", "daemon"]
categories = ["multimedia::audio", "command-line-utilities"]
publish = false

[lib]
name = "hark"
path = "src/lib.rs"

[[bin]]
name = "hark"
path = "src/main.rs"

[dependencies]
# Landmark fingerprinting and Shazam response models
hark-core = { path = "crates/hark-core" }

# Audio capture and lock-free buffers
cpal = "0.15"
rtrb = "0.3"

# Binary Serialization & Checksums
byteorder = "1.5"
crc32fast = "1.4"
base64 = "0.22"

# Network & Async
tokio = { version = "1.40", features = ["full", "signal", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4"] }
rand = "0.8"
chrono = "0.4"
libc = "0.2"

# D-Bus MPRIS2
zbus = { version = "5.0", features = ["tokio"] }

# CLI arguments & logging
clap = { version = "4.5", features = ["derive"] }

# JioSaavn Decryption & Media Tagging (Modular Standalone Crate)
jiosaavn = { path = "crates/jiosaavn" }
mp4ameta = "0.12"
dirs = "6.0.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 12
strip = true
