name: Bug report
description: Something does not work as expected
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Please look through the
        [troubleshooting section](https://github.com/omsingh02/hark#troubleshooting)
        and the existing issues first.

        Security problems should not be reported here. See the
        [security policy](https://github.com/omsingh02/hark/security/policy).

  - type: input
    id: version
    attributes:
      label: hark version
      description: Output of `hark --version`.
      placeholder: hark 0.1.0
    validations:
      required: true

  - type: input
    id: distro
    attributes:
      label: Distribution
      description: Name and version of your Linux distribution.
      placeholder: Arch Linux, Fedora 42, Ubuntu 24.04
    validations:
      required: true

  - type: dropdown
    id: sound-server
    attributes:
      label: Sound server
      options:
        - PipeWire
        - PulseAudio
        - Other or not sure
    validations:
      required: true

  - type: input
    id: source
    attributes:
      label: Capture source
      description: The value of `--source` hark is started with.
      placeholder: auto (default), mic or monitor

  - type: dropdown
    id: desktop
    attributes:
      label: Desktop or status bar
      options:
        - Waybar
        - Quickshell
        - GNOME
        - KDE Plasma
        - Other
        - None, command line only

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did and what you saw. Steps to reproduce help a lot.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Output of `journalctl --user -u hark -n 100 --no-pager` when running as a
        service, or the terminal output when running `hark` directly.
      render: shell
