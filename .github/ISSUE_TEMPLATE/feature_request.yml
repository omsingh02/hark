name: Feature request
description: Suggest an improvement or a new capability
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Describing the problem you want to solve is more
        useful than describing a specific implementation.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Your setup and what you are trying to do, for example which bar or shell you use.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like hark to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Workarounds you use today, or other approaches that came to mind.
