# Example Hyprland keybinds for hark.
#
# These are examples only. Copy the lines you want into hyprland.conf, or keep
# this file next to it and add:  source = ~/.config/hypr/hark.conf
# Change the keys to whatever does not clash with your own bindings, and make sure
# the hark binary is on the PATH of your Hyprland session.

# Pause or resume listening.
bind = SUPER, F9, exec, hark --toggle

# Show the recognised track as a notification.
bind = SUPER, F10, exec, notify-send -a hark "Now playing" "$(playerctl -p hark metadata artist) - $(playerctl -p hark metadata title)"
